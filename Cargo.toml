[package]
name = "tetris-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.14"
ndk = "0.9"
pollster = "0.3"
raw-window-handle = "0.6"
wgpu = "0.20"

[profile.release]
panic = "abort"
